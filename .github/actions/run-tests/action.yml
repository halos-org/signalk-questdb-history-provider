name: "Run Tests"
description: "Lint, build, and run the test suite against the built output"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

    - name: Install dependencies
      # package-lock.json is gitignored in this repo, so `npm ci` has nothing to
      # read on a clean checkout. Use it when a lockfile is present (reproducible
      # and faster) and fall back otherwise.
      run: |
        if [ -f package-lock.json ]; then npm ci; else npm install; fi
      shell: bash

    - name: Lint and format check
      run: npm run ci-lint
      shell: bash

    - name: Build and test
      # build:all is build -> test. The suites execute the compiled output in
      # dist/, so building is not an extra step here, it is what makes the
      # tests runnable at all.
      #
      # This covers the publish tarball too: src/test/package-e2e.test.ts runs
      # `npm pack --dry-run` and asserts what a Signal K server receives --
      # the entry point named by `main`, the app icon, no sources, and no
      # panel build output.
      run: npm run build:all
      shell: bash
